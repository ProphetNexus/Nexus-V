queries:
  severity_count: >
    SELECT severity, COUNT(*) as total 
    FROM cves 
    WHERE published BETWEEN %s AND %s 
    AND severity IS NOT NULL 
    AND severity <> 'NONE' 
    AND severity <> ''
    GROUP BY severity
    ORDER BY FIELD(severity, 'LOW', 'MEDIUM', 'HIGH', 'CRITICAL')
  
  volume_over_time: >
    SELECT 
      DATE(published) as date, 
      severity, 
      COUNT(*) as total,
      SUM(COUNT(*)) OVER (PARTITION BY DATE(published)) as `Daily Total`
    FROM cves 
    WHERE published BETWEEN %s AND %s 
    AND vuln_status <> 'Rejected'
    AND severity IS NOT NULL AND severity <> 'NONE' AND severity <> ''
    GROUP BY DATE(published), severity
    ORDER BY date ASC, FIELD(severity, 'LOW', 'MEDIUM', 'HIGH', 'CRITICAL')
  
  cisa_kev_active: >
    SELECT cve_id, cisa_vulnerability_name, severity, cisa_kev_date
    FROM cves
    WHERE cisa_kev_date BETWEEN %s AND %s
    ORDER BY cisa_kev_date DESC
  
  high_risk_matrix: >
    SELECT cve_id, score, exploitability_score, impact_score
    FROM cves
    WHERE published BETWEEN %s AND %s
    AND exploitability_score >= 7.0 
    AND impact_score >= 7.0
    ORDER BY score DESC
    LIMIT 20
  
  top_vulnerable_products: >
    SELECT p.cpe_string, COUNT(p.cve_id) as cve_count
    FROM cve_affected_products p
    JOIN cves c ON p.cve_id = c.cve_id
    WHERE c.published BETWEEN %s AND %s
    AND c.vuln_status <> 'Rejected'
    GROUP BY p.cpe_string
    ORDER BY cve_count DESC
    LIMIT 10
  
  search_by_cpe_keyword: >
    SELECT c.cve_id, c.score, p.cpe_string 
    FROM cves c
    INNER JOIN cve_affected_products p ON c.cve_id = p.cve_id
    WHERE p.cpe_string LIKE %s
    AND c.published BETWEEN %s AND %s
    AND c.vuln_status <> 'Rejected'
    ORDER BY c.score DESC