graphs:
  severity_count:
    x: "severity"
    y: "total"
    title: "CVE Severity Distribution"
    x_label: "Severity Level"
    y_label: "Number of CVEs"
    color: "severity"
    color_map:
      LOW: "#008000"
      MEDIUM: "#FFA500"
      HIGH: "#FF4500"
      CRITICAL: "#8B0000"
  volume_over_time:
    x: "date"
    y: "total"
    title: "CVE Volume Over Time"
    x_label: "Date"
    y_label: "Number of CVEs"
    color: "severity"
    color_map:
      LOW: "#008000"
      MEDIUM: "#FFA500"
      HIGH: "#FF4500"
      CRITICAL: "#8B0000"
  cisa_kev_active:
    x: "cve_id"
    y: "cisa_kev_date"
    title: "Active CISA KEV Vulnerabilities"
    x_label: "CVE ID"
    y_label: "KEV Date"
  high_risk_matrix:
    x: "cve_id"
    y: "score"
    title: "Top 20 High-Risk CVEs (Score > 7.0)"
    x_label: "CVE ID"
    y_label: "CVSS Score"
  top_vulnerable_products:
    x: "cpe_string"
    y: "cve_count"
    title: "Top 10 Most Vulnerable Products"
    x_label: "CPE String"
    y_label: "Vulnerability Count"
    color: "cpe_string"
  search_by_cpe_keyword:
    x: "cve_id"
    y: "score"
    title: "Search Results: Product Vulnerability Scores"
    x_label: "CVE ID"
    y_label: "CVSS Score"